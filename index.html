<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly - Your Simple Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Weatherly</h1>
            <p class="subtitle">Get live weather information anywhere</p>
        </header>

        <section class="card input-section">
            <div class="form-group">
                <label for="api-key">OpenWeatherMap API Key</label>
                <input type="password" id="api-key" placeholder="Enter your API key" autocomplete="off">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="e.g. London">
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="e.g. UK" maxlength="2">
                </div>
            </div>

            <button id="get-weather-btn" class="btn-primary">Get Weather</button>
        </section>

        <section id="error-section" class="error-section hidden">
            <p id="error-message"></p>
        </section>

        <section id="loading-section" class="loading-section hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </section>

        <section id="weather-result" class="weather-card hidden">
            <div class="weather-main">
                <div class="location-info">
                    <h2 class="location-name">London, UK</h2>
                    <p class="weather-condition">Sunny</p>
                    <p class="temperature">22°C</p>
                </div>
                <div class="weather-icon">
                    <span class="icon">☀️</span>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-label">Humidity</span>
                    <span class="detail-value">65%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Wind</span>
                    <span class="detail-value">5.2 m/s</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Pressure</span>
                    <span class="detail-value">1013 hPa</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Feels Like</span>
                    <span class="detail-value">24°C</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Visibility</span>
                    <span class="detail-value">10 km</span>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>Powered by <a href="https://openweathermap.org/api" target="_blank" rel="noopener">OpenWeatherMap API</a></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
